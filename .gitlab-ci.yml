stages:
  - test
  - audit

default:
  image: python:3.13-slim
  before_script:
    - python -m pip install --no-deps .

tests:
  stage: test
  script:
    - PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -t . -v
    - python scripts/check_stdlib.py

release-audit:
  stage: audit
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ripgrep
  script:
    - ./scripts/release-audit.sh
